name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🏷️ Sync Version from Git Tag
        run: |
          TAG_NAME="${{ github.ref_name }}"
          CLEAN_VER="${TAG_NAME#v}"
          echo "Syncing app version to $CLEAN_VER"
          npm version "$CLEAN_VER" --no-git-tag-version --allow-same-version
          node -e "
            const fs = require('fs');
            const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            appJson.expo.version = '$CLEAN_VER';
            fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2) + '\n');
          "

      - name: ⚙️ Prebuild Android Project
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Release APKs via Gradle (ABI Split + Universal)
        working-directory: ./mobile/android
        run: |
          TAG_NAME="${{ github.ref_name }}"
          CLEAN_VER="${TAG_NAME#v}"
          
          # 1. Build optimized ARM64-v8a APK (~20MB for 99.8% of modern Android devices)
          echo "🔨 Building arm64-v8a APK..."
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Project_S-v${CLEAN_VER}-arm64-v8a.apk
          
          # Clean build artifacts before second target build
          ./gradlew clean --no-daemon
          
          # 2. Build Universal fallback APK (~70MB for all CPU architectures)
          echo "🔨 Building universal APK..."
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Project_S-v${CLEAN_VER}-universal.apk
          
          # Remove untagged generic app-release.apk so only versioned files are published
          rm -f app/build/outputs/apk/release/app-release.apk

      - name: 🏷️ Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            mobile/android/app/build/outputs/apk/release/Project_S-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
