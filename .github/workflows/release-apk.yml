name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.10)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🏷️ Determine & Sync Version
        id: get_version
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            RAW_VER=$(node -p "require('./app.json').expo.version")
            TAG_NAME="v${RAW_VER}"
          fi
          
          CLEAN_VER="${TAG_NAME#v}"
          echo "Building version $CLEAN_VER (Tag: $TAG_NAME)"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "clean_ver=$CLEAN_VER" >> $GITHUB_OUTPUT

          npm version "$CLEAN_VER" --no-git-tag-version --allow-same-version
          node -e "
            const fs = require('fs');
            const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            appJson.expo.version = '$CLEAN_VER';
            fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2) + '\n');
          "

      - name: 🔨 Build Release APKs (ARM64-v8a + Universal)
        working-directory: ./mobile/android
        run: |
          CLEAN_VER="${{ steps.get_version.outputs.clean_ver }}"
          mkdir -p ../dist_apks
          
          # 1. Build optimized ARM64-v8a APK (~20MB for 99.8% of modern Android devices)
          echo "🔨 Building arm64-v8a APK..."
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
          cp app/build/outputs/apk/release/app-release.apk ../dist_apks/Project_S-v${CLEAN_VER}-arm64-v8a.apk
          
          # 2. Build Universal fallback APK (~70MB for all CPU architectures)
          # Note: No 'gradlew clean' so Gradle reuses intermediate compiler & hermes cache!
          echo "🔨 Building universal APK..."
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
          cp app/build/outputs/apk/release/app-release.apk ../dist_apks/Project_S-v${CLEAN_VER}-universal.apk

          echo "✅ Generated Release Artifacts:"
          ls -lh ../dist_apks

      - name: 🏷️ Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Release ${{ steps.get_version.outputs.tag_name }}
          files: |
            mobile/dist_apks/Project_S-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
