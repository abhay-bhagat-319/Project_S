name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.2.3)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🏷️ Determine & Validate Version Safely
        id: get_version
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG_NAME" ]; then
            TAG_NAME="$INPUT_TAG_NAME"
          elif [[ "$GITHUB_REF_NAME" == v* ]]; then
            TAG_NAME="$GITHUB_REF_NAME"
          else
            RAW_VER=$(node -p "require('./app.json').expo.version")
            TAG_NAME="v${RAW_VER}"
          fi

          CLEAN_VER="${TAG_NAME#v}"

          # Strict semantic version validation to prevent command/script injection
          if [[ ! "$CLEAN_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semantic version string: $CLEAN_VER"
            exit 1
          fi

          echo "Building version $CLEAN_VER (Tag: v$CLEAN_VER)"
          echo "tag_name=v$CLEAN_VER" >> "$GITHUB_OUTPUT"
          echo "clean_ver=$CLEAN_VER" >> "$GITHUB_OUTPUT"

          npm version "$CLEAN_VER" --no-git-tag-version --allow-same-version
          CLEAN_VER="$CLEAN_VER" node -e '
            const fs = require("fs");
            const appJson = JSON.parse(fs.readFileSync("app.json", "utf8"));
            appJson.expo.version = process.env.CLEAN_VER;
            fs.writeFileSync("app.json", JSON.stringify(appJson, null, 2) + "\n");
          '

      - name: ⚙️ Generate Android Native Project
        run: npx expo prebuild --platform android --no-install

      - name: 🔐 Configure Production Release Keystore
        working-directory: ./mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "SIGNING_ARGS=-Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not configured. Configure a production keystore in GitHub Secrets before publishing release APKs."
            echo "SIGNING_ARGS=" >> "$GITHUB_ENV"
          fi

      - name: 🔨 Build Release APKs & SHA-256 Checksums
        working-directory: ./mobile/android
        env:
          CLEAN_VER: ${{ steps.get_version.outputs.clean_ver }}
        run: |
          mkdir -p ../dist_apks

          echo "🔨 Building arm64-v8a APK..."
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a $SIGNING_ARGS
          cp app/build/outputs/apk/release/app-release.apk "../dist_apks/Project_S-v${CLEAN_VER}-arm64-v8a.apk"

          echo "🔨 Building universal APK..."
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 $SIGNING_ARGS
          cp app/build/outputs/apk/release/app-release.apk "../dist_apks/Project_S-v${CLEAN_VER}-universal.apk"

          cd ../dist_apks
          sha256sum Project_S-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 🧹 Clean Temporary Keystore
        if: always()
        working-directory: ./mobile/android
        run: rm -f app/release.keystore

      - name: 🏷️ Publish GitHub Release with APKs & Checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Release ${{ steps.get_version.outputs.tag_name }}
          files: |
            mobile/dist_apks/Project_S-*.apk
            mobile/dist_apks/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
