name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🏷️ Sync Version from Git Tag
        run: |
          TAG_NAME="${{ github.ref_name }}"
          CLEAN_VER="${TAG_NAME#v}"
          echo "Syncing app version to $CLEAN_VER"
          npm version "$CLEAN_VER" --no-git-tag-version --allow-same-version
          node -e "
            const fs = require('fs');
            const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            appJson.expo.version = '$CLEAN_VER';
            fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2) + '\n');
          "

      - name: ⚙️ Prebuild Android Project
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Release APK via Gradle
        working-directory: ./mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: 🏷️ Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            mobile/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
